<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelliworx Consulting - Executive Search & Recruitment Agency</title>
    <script type="text/javascript">
      // Check if redirected from 404.html
      (function() {
        var redirect = window.location.search.match(/[\?&]p=([^&]*)/);
        if (redirect && redirect[1]) {
          var decoded = decodeURIComponent(redirect[1]);
          window.history.replaceState(null, null, window.location.pathname.slice(0, -1) + decoded + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
